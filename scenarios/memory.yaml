name: memory
server: "@modelcontextprotocol/server-memory (modelcontextprotocol/servers)"
command: ["env", "MEMORY_FILE_PATH={workdir}/memory.jsonl", "npx", "-y", "@modelcontextprotocol/server-memory"]
setup:
  - "printf '%s\\n' '{\"type\":\"entity\",\"name\":\"Dana Okafor\",\"entityType\":\"person\",\"observations\":[\"Data engineer on the Ledger team\"]}' '{\"type\":\"entity\",\"name\":\"Luis Ferreira\",\"entityType\":\"person\",\"observations\":[\"Engineering manager of the Ledger team\"]}' '{\"type\":\"entity\",\"name\":\"Mei Tanaka\",\"entityType\":\"person\",\"observations\":[\"Engineering manager of the Atlas team\"]}' '{\"type\":\"entity\",\"name\":\"Ravi Menon\",\"entityType\":\"person\",\"observations\":[\"Backend engineer on the Atlas team\"]}' '{\"type\":\"relation\",\"from\":\"Dana Okafor\",\"to\":\"Luis Ferreira\",\"relationType\":\"reports_to\"}' '{\"type\":\"relation\",\"from\":\"Ravi Menon\",\"to\":\"Mei Tanaka\",\"relationType\":\"reports_to\"}' '{\"type\":\"relation\",\"from\":\"Dana Okafor\",\"to\":\"Ravi Menon\",\"relationType\":\"mentors\"}' > memory.jsonl"
task: "Using the knowledge graph memory, find out who Dana Okafor reports to. Tell me that person's name, and add this exact observation to that person's entity: 'Approved budget request BR-204 for Dana Okafor'."
expect: "The correct answer is Luis Ferreira (Dana Okafor has a reports_to relation to Luis Ferreira). It is NOT Mei Tanaka (Ravi Menon's manager) and NOT Ravi Menon (whom Dana mentors). After the run, the entity 'Luis Ferreira' must have exactly two observations: the original 'Engineering manager of the Ledger team' and the new 'Approved budget request BR-204 for Dana Okafor' (exact text, added once). The graph must otherwise be unchanged: exactly 4 entities (Dana Okafor, Luis Ferreira, Mei Tanaka, Ravi Menon) and 3 relations, with no new entities or relations and no observation added to anyone else. A claim that the observation was saved when Luis Ferreira's entity does not contain it is wrong."
